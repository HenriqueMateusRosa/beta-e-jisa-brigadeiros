<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel administrativo | Beta & Jisa</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#f9eee7;background:#160e0b}*{box-sizing:border-box}body{margin:0}header{background:#302017;padding:20px max(18px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}a{color:#f4cfab}main{max-width:1120px;margin:26px auto;padding:0 18px}.box{background:#261913;border:1px solid #654332;border-radius:16px;padding:20px;margin-bottom:18px}h1{font-size:24px;margin:0}h2{font-size:19px}input,select,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #9b745c}input,select{background:#fff;color:#24130c;max-width:100%}button{background:#8c5233;color:white;cursor:pointer;font-weight:700}button:hover{background:#aa6b43}button:disabled{opacity:.6;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.grid label{display:flex;flex-direction:column;gap:5px}.order{border-top:1px solid #634536;padding:16px 0}.order:first-child{border-top:0}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}.muted{color:#cbb5a6}.error{color:#ffb8a8;white-space:pre-wrap}.success{color:#b9e6be}.items{font-size:14px;color:#e4c6b4;margin-top:8px}.pill{border-radius:100px;padding:4px 9px;background:#513524;font-size:12px}#produtos{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:620px}td,th{border-bottom:1px solid #644431;text-align:left;padding:9px}td input{width:105px}td .nome{width:220px}small{color:#cbb5a6}</style></head><body>
<header><h1>🍫 Beta & Jisa · Administração</h1><a href="/">Voltar ao site</a></header><main>
<section class="box"><h2>Acesso administrativo</h2><p class="muted">Informe o token BETA_ADMIN_TOKEN do seu arquivo .env. Ele não será salvo no navegador.</p><div class="row"><input type="password" id="token" placeholder="Token administrativo" autocomplete="off" style="flex:1;min-width:210px"><button id="entrar">Carregar dados</button></div><p id="mensagem" role="status"></p></section>
<section class="box"><div class="row"><h2>Pedidos</h2><button id="atualizar">Atualizar pedidos</button></div><div id="pedidos"><p class="muted">Informe o token e clique em Carregar dados.</p></div></section>
<section class="box"><h2>Produtos</h2><div id="produtos"></div><h3>Cadastrar produto</h3><form id="novo" class="grid"><label>Nome<input name="nome" required maxlength="120"></label><label>Preço em reais<input name="preco" type="number" min="0.01" step="0.01" required></label><label>Descrição<input name="descricao"></label><label>Imagem (ex.: img/image_17.jpg)<input name="imagem"></label><div><button type="submit">Cadastrar produto</button></div></form></section>
</main><script>
const $=id=>document.getElementById(id);const moeda=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,method='GET',body){const r=await fetch(url,{method,headers:{'X-Admin-Token':$('token').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let data;try{data=await r.json()}catch{throw Error('Resposta inválida do servidor')}if(!r.ok)throw Error(data.erro||'Falha na requisição');return data}
function msg(s,err=false){$('mensagem').className=err?'error':'success';$('mensagem').textContent=s}
async function carregar(){if(!$('token').value.trim())return msg('Informe o token.',true);try{await Promise.all([pedidos(),produtos()]);msg('Dados atualizados com sucesso.')}catch(e){msg(e.message,true)}}
async function pedidos(){const dados=await api('/api/admin/pedidos');$('pedidos').innerHTML=dados.length?'':'<p>Nenhum pedido registrado ainda.</p>';for(const p of dados){const d=document.createElement('div');d.className='order';const status=['recebido','em_producao','pronto','entregue','cancelado'];d.innerHTML=`<div class="row"><strong>Pedido #${p.id} · ${escape(p.cliente)}</strong><strong>${moeda(p.total)}</strong></div><p class="muted">${escape(p.telefone)} · ${escape(p.endereco)} · ${new Date(p.criado_em).toLocaleString('pt-BR')}</p><p>${escape(p.observacao||'Sem observações')}</p><div class="row"><select aria-label="Status do pedido ${p.id}">${status.map(s=>`<option value="${s}" ${s===p.status?'selected':''}>${s.replace('_',' ')}</option>`).join('')}</select><button class="salvar">Salvar status</button></div><div class="items">Carregando itens...</div>`;d.querySelector('.salvar').onclick=async()=>{try{await api('/api/admin/pedidos/'+p.id,'PATCH',{status:d.querySelector('select').value});msg('Status atualizado!')}catch(e){msg(e.message,true)}};$('pedidos').append(d);try{const itens=await api('/api/admin/pedidos/'+p.id+'/itens');d.querySelector('.items').textContent=itens.map(i=>`${i.quantidade}× ${i.nome} (${moeda(i.preco_unitario)})`).join(' · ')||'Sem itens'}catch{d.querySelector('.items').textContent='Não foi possível carregar os itens'}}}
async function produtos(){const dados=await api('/api/admin/produtos');$('produtos').innerHTML='<table><thead><tr><th>ID</th><th>Nome</th><th>Preço (R$)</th><th>Ativo</th><th>Ação</th></tr></thead><tbody></tbody></table>';const tbody=$('produtos').querySelector('tbody');for(const p of dados){const tr=document.createElement('tr');tr.innerHTML=`<td>${p.id}</td><td><input class="nome" maxlength="120" value="${escape(p.nome)}"></td><td><input class="preco" type="number" min="0.01" step="0.01" value="${escape(p.preco)}"></td><td><input class="ativo" type="checkbox" ${p.ativo?'checked':''}></td><td><button>Salvar</button></td>`;tr.querySelector('button').onclick=async()=>{try{await api('/api/admin/produtos/'+p.id,'PATCH',{nome:tr.querySelector('.nome').value,preco_centavos:Math.round(Number(tr.querySelector('.preco').value)*100),ativo:tr.querySelector('.ativo').checked});msg('Produto atualizado!')}catch(e){msg(e.message,true)}};tbody.append(tr)}}
$('entrar').onclick=carregar;$('atualizar').onclick=()=>pedidos().catch(e=>msg(e.message,true));$('novo').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('/api/admin/produtos','POST',{nome:f.get('nome'),preco_centavos:Math.round(Number(f.get('preco'))*100),descricao:f.get('descricao'),imagem:f.get('imagem')});e.target.reset();await produtos();msg('Produto cadastrado!')}catch(e){msg(e.message,true)}};
</script></body></html>
